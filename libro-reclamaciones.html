<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libro de Reclamaciones | Caty's</title>
    <link rel="stylesheet" href="/css/libro-reclamaciones.css">
</head>
<body class="rec-body">

    <header class="rec-header">
        <a href="index.html">
            <img src="/img/Logo.svg" alt="Logo de Caty's">
        </a>
    </header>

    <main class="rec-wrapper">
        <h1 class="rec-title">LIBRO DE RECLAMACIONES VIRTUAL</h1>
        <p class="rec-meta">Fecha: <span id="fecha-actual"></span> | N° Hoja: <span id="num-hoja"></span></p>

        <form id="rec-form" class="rec-form">
            <!-- SECCIÓN 1 -->
            <section class="rec-section">
                <h3>1. IDENTIFICACIÓN DEL CONSUMIDOR</h3>
                <div class="rec-input-group">
                    <label>Nombre Completo *</label>
                    <input type="text" required>
                </div>
                <div class="rec-row">
                    <div class="rec-input-group">
                        <label>Tipo de Documento *</label>
                        <select id="tipo-doc">
                            <option value="DNI">DNI</option>
                            <option value="CE">Carnet Extranjería</option>
                        </select>
                    </div>
                    <div class="rec-input-group">
                        <label>Número de Documento *</label>
                        <input type="text" id="num-doc" maxlength="8" required>
                    </div>
                </div>
                <div class="rec-input-group">
                    <label>Domicilio *</label>
                    <input type="text" required>
                </div>
                <div class="rec-row">
                    <div class="rec-input-group">
                        <label>Teléfono *</label>
                        <input type="tel" required>
                    </div>
                    <div class="rec-input-group">
                        <label>E-mail *</label>
                        <input type="email" required>
                    </div>
                </div>
            </section>

            <!-- SECCIÓN 2 -->
            <section class="rec-section">
                <h3>2. IDENTIFICACIÓN DEL BIEN</h3>
                <div class="rec-radio-group">
                    <label><input type="radio" name="bien" value="producto" checked> Producto</label>
                    <label><input type="radio" name="bien" value="servicio"> Servicio</label>
                </div>
                <div class="rec-input-group" style="margin-top:15px;">
                    <label>Descripción *</label>
                    <textarea rows="3" required></textarea>
                </div>
            </section>

            <!-- SECCIÓN 3 -->
            <section class="rec-section">
                <h3>3. DETALLE Y PEDIDO</h3>
                <div class="rec-input-group">
                    <label>Detalle del reclamo *</label>
                    <textarea rows="4" required></textarea>
                </div>
                <div class="rec-input-group">
                    <label>Pedido del consumidor *</label>
                    <textarea rows="2" required></textarea>
                </div>
                <div class="rec-radio-group">
                    <label><input type="radio" name="tipo" value="reclamo" checked> RECLAMO</label>
                    <label><input type="radio" name="tipo" value="queja"> QUEJA</label>
                </div>
            </section>

            <button type="submit" class="rec-btn-submit">ENVIAR RECLAMACIÓN</button>
        </form>
    </main>

    <footer class="rec-footer">
        <p>El proveedor debe dar respuesta en un plazo no mayor a 15 días hábiles.</p>
    </footer>

    <script src="/js/libro-reclamaciones.js"></script>
</body>
</html>
